name: Build ipk Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: 25.12.0
  ARCH: aarch64_cortex-a72
  NM_BUILD_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: openwrt/sdk:aarch64_cortex-a72-25.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          sh -n "$GITHUB_WORKSPACE/install.sh"
          sh -n "$GITHUB_WORKSPACE/netmonitor/files/usr/bin/netmonitor"
          sh -n "$GITHUB_WORKSPACE/netmonitor/files/usr/libexec/rpcd/netmonitor"
          sh -n "$GITHUB_WORKSPACE/netmonitor/files/etc/init.d/netmonitor"

      - name: Add feed
        run: |
          cd /homebuilder/openwrt
          echo "src-link netmonitor $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update netmonitor
          ./scripts/feeds install -a -p netmonitor

      - name: Install luci dependency
        run: |
          cd /homebuilder/openwrt
          ./scripts/feeds update luci
          ./scripts/feeds install luci

      - name: Configure
        run: |
          cd /homebuilder/openwrt
          make defconfig
          echo 'CONFIG_PACKAGE_netmonitor=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-netmonitor=m' >> .config
          make defconfig

      - name: Compile
        run: |
          cd /homebuilder/openwrt
          make package/netmonitor/compile -j$(nproc) V=s || make package/netmonitor/compile V=s
          make package/luci-app-netmonitor/compile -j$(nproc) V=s || make package/luci-app-netmonitor/compile V=s

      - name: Collect and rename
        run: |
          cd /homebuilder/openwrt
          mkdir -p $GITHUB_WORKSPACE/out
          NETMONITOR_APKS=$(find bin/packages -type f -path '*/netmonitor/netmonitor-*.apk' -print)
          LUCI_APKS=$(find bin/packages -type f -path '*/netmonitor/luci-app-netmonitor-*.apk' -print)
          [ "$(printf '%s\n' "$NETMONITOR_APKS" | sed '/^$/d' | wc -l)" -eq 1 ]
          [ "$(printf '%s\n' "$LUCI_APKS" | sed '/^$/d' | wc -l)" -eq 1 ]
          NETMONITOR_APK=$NETMONITOR_APKS
          LUCI_APK=$LUCI_APKS
          cp "$NETMONITOR_APK" $GITHUB_WORKSPACE/out/netmonitor.ipk
          cp "$LUCI_APK" $GITHUB_WORKSPACE/out/luci-app-netmonitor.ipk
          (cd $GITHUB_WORKSPACE/out && sha256sum netmonitor.ipk luci-app-netmonitor.ipk > SHA256SUMS)
          ls -l $GITHUB_WORKSPACE/out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ipks
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ipks
          path: out

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          files: out/*
          body: |
            自动构建（main 分支最新提交）
            - netmonitor.ipk
            - luci-app-netmonitor.ipk
          make_latest: true
